name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python .github/scripts/release.py validate "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.validate.outputs.version }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/setup-musl
        if: runner.os == 'Linux'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Smoke test and package
        shell: bash
        run: |
          binary="target/$TARGET/release/devops"
          if [[ "$TARGET" == *windows* ]]; then binary="$binary.exe"; fi
          if [[ "$TARGET" == *musl ]]; then
            python .github/scripts/release.py verify-static "$binary"
            docker run --rm --network none --volume "$PWD/$binary:/usr/local/bin/devops:ro" alpine:3.22 devops --version
          fi
          test "$("$binary" --version)" = "devops $VERSION"
          python .github/scripts/release.py package "$VERSION" "$TARGET" "$binary" dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Publish complete release
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Install on Windows x64 or Linux/WSL x64 with mise:

          \`mise use -g github:$GH_REPO@$VERSION\`

          Start setup with \`devops login\`. Enter your organization and a personal access token at the masked prompt; no Entra app registration is required. Entra sign-in remains available with \`--entra\`.
          This release groups pipelines by folder in an aligned table and adds a project-wide recent-runs table. Press r in Pipelines for recent runs; it refreshes every 30 seconds while visible and preserves your selection. Enter opens the run timeline and logs. Project and Account are now in Settings (s).

          Linux uses a static musl binary, with no glibc requirement. ARM64 and macOS builds are not provided.
          Live tenant authentication acceptance is still required. See the README and docs/acceptance.md.
          EOF
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file release-notes.md --generate-notes "${options[@]}"
          gh release edit "$RELEASE_TAG" --draft=false

  install-smoke:
    needs: [validate, publish]
    uses: ./.github/workflows/install-smoke.yml
    with:
      version: ${{ needs.validate.outputs.version }}
